<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coliving — Habitaciones & Stock</title>
  <link rel="icon" type="image/jpeg" href="Logo-bicicleta.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/icons.js"></script>
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Marca y Logo de Bicicleta -->
      <div class="brand-section" onclick="Coliving.app.switchTab('rooms')">
        <img src="Logo-bicicleta.jpg" alt="Logo Coliving" class="brand-logo">
        <div class="brand-info">
          <h1>COLIVING</h1>
          <span>Centro & Boulevares</span>
        </div>
      </div>

      <!-- Navegación de Escritorio -->
      <nav class="desktop-nav">
        <button class="nav-link-btn active" data-nav-target="rooms">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg>
          Habitaciones
        </button>
        <button class="nav-link-btn" data-nav-target="tasks">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          Trabajos Pendientes <span class="nav-counter" id="count-pending-tasks">0</span>
        </button>
        <button class="nav-link-btn" data-nav-target="stock">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Stock
        </button>
        <button class="nav-link-btn" onclick="Coliving.app.openBackupModal()" title="Copia de seguridad">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Respaldo
        </button>
        <button class="nav-link-btn theme-toggle-btn" onclick="Coliving.app.toggleTheme()" title="Cambiar tema">
          <span class="theme-toggle-icon"></span>
          <span class="theme-toggle-label">Modo Claro</span>
        </button>
      </nav>

      <!-- Botón Menú Hamburguesa para Móvil -->
      <button class="hamburger-btn" id="btn-hamburger-toggle" aria-label="Abrir menú" title="Menú">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

    </div>
  </header>

  <!-- Menú Desplegable Móvil (Drawer) -->
  <div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>
  <aside class="mobile-nav-drawer" id="mobile-nav-drawer">
    <div class="mobile-drawer-header">
      <div class="brand-section">
        <img src="Logo-bicicleta.jpg" alt="Logo" class="brand-logo-small">
        <span class="font-bold">COLIVING</span>
      </div>
      <button class="drawer-close-btn" onclick="Coliving.app.closeMobileMenu()">&times;</button>
    </div>

    <div class="mobile-drawer-links">
      <button class="mobile-nav-item active" data-nav-target="rooms">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg>
        Habitaciones
      </button>
      <button class="mobile-nav-item" data-nav-target="tasks">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Trabajos Pendientes
      </button>
      <button class="mobile-nav-item" data-nav-target="stock">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Control de Stock
      </button>
      <button class="mobile-nav-item" onclick="Coliving.app.openBackupModal(); Coliving.app.closeMobileMenu();">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Copia de Seguridad
      </button>
      <hr style="border:0; border-top: 1px solid var(--border); margin: 6px 0;">
      <!-- Botón de Modo Oscuro / Claro en el menú móvil -->
      <button class="mobile-nav-item" onclick="Coliving.app.toggleTheme()">
        <span class="theme-toggle-icon"></span>
        <span class="theme-toggle-label">Modo Claro</span>
      </button>
    </div>
  </aside>

  <!-- Contenedor Principal -->
  <main class="app-main">

    <!-- ==========================================
         VISTA 1: HABITACIONES (Con Filtro de Sucursal trasladado aquí)
         ========================================== -->
    <section id="view-rooms" class="app-view active">
      <div class="rooms-toolbar">
        <!-- Filtro Único de Sucursales (Solo en Habitaciones) -->
        <div class="branch-selector" title="Filtrar por sucursal">
          <button class="branch-pill active" data-branch-select="all">Todas</button>
          <button class="branch-pill pill-centro" data-branch-select="centro">Centro</button>
          <button class="branch-pill pill-boulevares" data-branch-select="boulevares">Boulevares</button>
        </div>

        <!-- Buscador -->
        <div class="search-box">
          <div class="search-input-wrapper">
            <svg class="search-icon ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text"
                   id="room-search-input"
                   class="search-input"
                   placeholder="Buscar por número (o letra) o inquilino...">
          </div>
        </div>
      </div>

      <!-- Grilla de Habitaciones -->
      <div id="rooms-list-container"></div>
    </section>

    <!-- ==========================================
         VISTA 2: TRABAJOS PENDIENTES
         ========================================== -->
    <section id="view-tasks" class="app-view">
      <div class="section-title-bar">
        <div>
          <h2 class="view-title flex-align-gap">
            <svg class="ui-icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Trabajos Pendientes
          </h2>
          <p class="view-subtitle">Mantenimiento y reparaciones anotadas por habitación</p>
        </div>
      </div>

      <!-- Grilla de Trabajos Pendientes -->
      <div id="tasks-list-container"></div>
    </section>

    <!-- ==========================================
         VISTA 3: STOCK
         ========================================== -->
    <section id="view-stock" class="app-view">
      <div class="section-title-bar">
        <div>
          <h2 class="view-title flex-align-gap">
            <svg class="ui-icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Control de Stock
          </h2>
          <p class="view-subtitle">Planilla de 3 columnas: Elemento | Centro (izq) | Boulevares (der)</p>
        </div>
      </div>

      <!-- Contenedor Dinámico de Stock -->
      <div id="stock-view-container"></div>
    </section>

  </main>

  <!-- Modal Universal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-card" id="modal-content-container"></div>
  </div>

  <!-- Notificaciones Toast -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
